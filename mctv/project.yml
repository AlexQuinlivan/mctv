# xcodegen spec for the tvOS app. aot/aot.py generates and builds it.
name: MCTV
options:
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    CLANG_ENABLE_OBJC_ARC: YES
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    CODE_SIGN_STYLE: Automatic
    # Set on the xcodebuild command line from config/signing.env for device builds.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ENABLE_DEBUG_DYLIB: NO
    # The app's bundle ID. The Top Shelf extension appends ".topshelf". Device
    # builds set it from config/signing.env.
    MCTV_BUNDLE_ID: com.example.mctv
    MCTV_DISPLAY_NAME: MCTV
    # Where embed.sh finds the native libraries (<dir>/<platform>).
    MCTV_NATIVES_DIR: $(PROJECT_DIR)/../build/natives
    # The game as a dylib for Frameworks, and the flags that link it.
    MCTV_GAME_LIBRARY: ""
    MCTV_GAME_LDFLAGS: ""
targets:
  MCTV:
    type: application
    platform: tvOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MCTV_BUNDLE_ID)
        PRODUCT_NAME: MCTV
        # Icon and Top Shelf images, drawn by scripts/make-art.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        CODE_SIGN_ENTITLEMENTS: Entitlements/MCTV.entitlements
        TARGETED_DEVICE_FAMILY: "3"
        # SDL finds mctv_sdl_host() with dlsym, so nothing may be stripped.
        DEAD_CODE_STRIPPING: NO
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Sources/include"
        OTHER_LDFLAGS: ["$(inherited)", "$(MCTV_GAME_LDFLAGS)"]
    dependencies:
      - target: MCTVTopShelf
      - sdk: Security.framework
      - sdk: QuartzCore.framework
      - sdk: Metal.framework
      - sdk: GameController.framework
    postCompileScripts:
      - name: Embed the game and native libraries
        script: bash "$PROJECT_DIR/embed.sh"
        basedOnDependencyAnalysis: false
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: $(MCTV_DISPLAY_NAME)
        UIRequiredDeviceCapabilities: [arm64]
        UIUserInterfaceStyle: Dark
        CFBundleURLTypes:
          - CFBundleURLName: $(MCTV_BUNDLE_ID)
            CFBundleURLSchemes: [mctv]
        # The 2021+ Siri Remote's ring and centre (GCDirectionalGamepad) need these.
        GCSupportsMultipleMicroGamepads: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
          - ProfileName: DirectionalGamepad
        NSLocalNetworkUsageDescription: MCTV plays on Minecraft servers on your network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: MCSceneDelegate
  # Full-screen Top Shelf art (TopShelf/MCTopShelf.m).
  MCTVTopShelf:
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MCTV_BUNDLE_ID).topshelf
        PRODUCT_NAME: MCTVTopShelf
        TARGETED_DEVICE_FAMILY: "3"
    dependencies:
      - sdk: TVServices.framework
    info:
      path: Generated/TopShelf-Info.plist
      properties:
        CFBundleDisplayName: $(MCTV_DISPLAY_NAME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: MCTopShelf
